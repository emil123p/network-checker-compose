services:
  network-checker:
    image: ghcr.io/emil123p/network-checker:sha-22bb4b4
    entrypoint: ["/bin/sh", "/app/monitor.sh"]
    environment:
      CHECK_HOST: ${CHECK_HOST:-github.com}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-30}
      CHECK_TIMEOUT: ${CHECK_TIMEOUT:-3}
    volumes:
      - ${NETWORK_CHECKER_LOG_DIR:-./logs}:/app/logs
      - ./monitor.sh:/app/monitor.sh:ro
    restart: unless-stopped
